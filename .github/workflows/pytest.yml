name: Python Playwright Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  schedule:
    - cron: '30 19 * * 0-4'   # Runs at 19:30 UTC (1:00 AM IST), Sunday through Thursday
    
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          VERSION=8.18.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks Scan
        continue-on-error: true
        run: |
          gitleaks detect --source . --report-format json --verbose || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        browser: [chromium]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create project environment files from secrets
        if: env.PROJECT_CREDS != ''
        run: |
          python -c "
          import os, json
          creds = json.loads(os.getenv('PROJECT_CREDS', '{}'))
          for project, env_vars in creds.items():
              lines = [f'{k}={v}' for k, v in env_vars.items()]
              os.makedirs('config', exist_ok=True)
              with open(f'config/{project}.env', 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
              print(f'Generated config/{project}.env')
          "
        env:
          PROJECT_CREDS: ${{ secrets.PROJECT_CREDS }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run tests
        continue-on-error: true
        env:
          HEADLESS: true
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          PROJECT_ARG=""
          MARKER_ARG=""

          if [ -n "$COMMIT_MSG" ]; then
            PARSED_PROJECT=$(echo "$COMMIT_MSG" | grep -oP '\[project:\s*\K[^\]]+' || true)
            PARSED_PROJECTS=$(echo "$COMMIT_MSG" | grep -oP '\[projects:\s*\K[^\]]+' || true)
            PARSED_MARKER=$(echo "$COMMIT_MSG" | grep -oP '\[marker:\s*\K[^\]]+' || true)
            PARSED_MARKERS=$(echo "$COMMIT_MSG" | grep -oP '\[markers:\s*\K[^\]]+' || true)

            PROJECT_VAL=""
            if [ -n "$PARSED_PROJECTS" ]; then
              PROJECT_VAL="$PARSED_PROJECTS"
            elif [ -n "$PARSED_PROJECT" ]; then
              PROJECT_VAL="$PARSED_PROJECT"
            fi

            if [ -n "$PROJECT_VAL" ]; then
              PROJECT_ARG="--project=$PROJECT_VAL"
              export PROJECT="$PROJECT_VAL"
            fi

            MARKER_VAL=""
            if [ -n "$PARSED_MARKERS" ]; then
              MARKER_VAL="$PARSED_MARKERS"
            elif [ -n "$PARSED_MARKER" ]; then
              MARKER_VAL="$PARSED_MARKER"
            fi

            if [ -n "$MARKER_VAL" ]; then
              CLEAN_MARKER=$(echo "$MARKER_VAL" | sed 's/,/ or /g')
              MARKER_ARG="-m \"$CLEAN_MARKER\""
            fi
          fi

          echo "Executing: pytest -o addopts=\"--browser chromium --video=retain-on-failure\" --maxfail=1 --disable-warnings -q $PROJECT_ARG $MARKER_ARG"
          eval pytest -o addopts="--browser chromium --video=retain-on-failure" --maxfail=1 --disable-warnings -q $PROJECT_ARG $MARKER_ARG

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-artifacts
          path: |
            Artifacts/**
            reports/**
