name: Test and Report Workflow

on:
  push:
    branches:
      - master

  schedule:
    - cron: '30 19 * * 0-4'   # Runs at 19:30 UTC (1:00 AM IST), Sunday through Thursday

  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run (atcu, lct, sampark, swaraj, trio)'
        required: false
      projects:
        description: 'Comma-separated list of projects, e.g. atcu,lct'
        required: false
      marker:
        description: 'Pytest marker expression, e.g. smoke, regression and not slow'
        required: false
      report_dir:
        description: 'Optional base report directory'
        required: false
        default: 'reports'
  repository_dispatch:
    types:
      - run-project-report

env:
  REPORT_DIR: ${{ github.workspace }}/reports
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-report:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'
      PROJECT_INPUT: ${{ github.event.inputs.project }}
      PROJECTS_INPUT: ${{ github.event.inputs.projects }}
      MARKER_INPUT: ${{ github.event.inputs.marker }}
      REPORT_DIR_INPUT: ${{ github.event.inputs.report_dir }}
      TARGET_REPORT_DIR: ${{ github.event.client_payload.report_dir || github.event.inputs.report_dir || 'reports' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure Playwright system dependencies
        run: |
          # install any missing system dependencies Playwright needs
          npx playwright install-deps || true

      - name: Run tests and generate reports
        continue-on-error: true
        run: |
          EVENT_PROJECT=${{ github.event.client_payload.project || github.event.inputs.project || '' }}
          EVENT_PROJECTS=${{ github.event.client_payload.projects || github.event.inputs.projects || '' }}
          EVENT_MARKER=${{ github.event.client_payload.marker || github.event.inputs.marker || '' }}

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit Message: $COMMIT_MSG"

          if [ -z "$EVENT_PROJECT" ] && [ -z "$EVENT_PROJECTS" ] && [ -n "$COMMIT_MSG" ]; then
            PARSED_PROJECT=$(echo "$COMMIT_MSG" | grep -oP '\[project:\s*\K[^\]]+' || true)
            PARSED_PROJECTS=$(echo "$COMMIT_MSG" | grep -oP '\[projects:\s*\K[^\]]+' || true)
            if [ -n "$PARSED_PROJECTS" ]; then
              EVENT_PROJECTS="$PARSED_PROJECTS"
            elif [ -n "$PARSED_PROJECT" ]; then
              EVENT_PROJECT="$PARSED_PROJECT"
            fi
          fi

          if [ -z "$EVENT_MARKER" ] && [ -n "$COMMIT_MSG" ]; then
            PARSED_MARKER=$(echo "$COMMIT_MSG" | grep -oP '\[marker:\s*\K[^\]]+' || true)
            PARSED_MARKERS=$(echo "$COMMIT_MSG" | grep -oP '\[markers:\s*\K[^\]]+' || true)
            if [ -n "$PARSED_MARKERS" ]; then
              EVENT_MARKER="$PARSED_MARKERS"
            elif [ -n "$PARSED_MARKER" ]; then
              EVENT_MARKER="$PARSED_MARKER"
            fi
          fi

          TARGET_REPORT_DIR=${{ env.TARGET_REPORT_DIR }}
          ARGS="--report-dir \"$TARGET_REPORT_DIR\""

          if [ -n "$EVENT_PROJECTS" ]; then
            ARGS="$ARGS --projects \"$EVENT_PROJECTS\""
          elif [ -n "$EVENT_PROJECT" ]; then
            ARGS="$ARGS --project $EVENT_PROJECT"
          fi

          if [ -n "$EVENT_MARKER" ]; then
            ARGS="$ARGS --marker \"$EVENT_MARKER\""
          elif [ -n "$CI" ]; then
            ARGS="$ARGS --marker smoke"
          fi

          echo "Executing: python utils/generate_reports.py $ARGS"
          eval python utils/generate_reports.py $ARGS

      - name: Verify generated reports
        run: |
          echo "Checking for report files..."
          REPORT_FILES=$(find "${{ env.TARGET_REPORT_DIR }}" -type f \( -name 'report.json' -o -name 'report.html' -o -name 'report.xlsx' \) | sort)
          echo "$REPORT_FILES"
          if [ -z "$REPORT_FILES" ]; then
            echo "No generated report files found"
            exit 1
          fi

      - name: Resolve report attachments
        id: report_attachments
        if: always()
        shell: bash
        run: |
          set -e
          BASE_DIR="${{ env.TARGET_REPORT_DIR }}"
          if [ ! -d "$BASE_DIR" ]; then
            echo "Report directory not found: $BASE_DIR"
            exit 0
          fi

          mapfile -t ATTACHMENTS < <(find "$BASE_DIR" -type f \( -name 'report.html' -o -name 'report.xlsx' \) | sort)
          if [ ${#ATTACHMENTS[@]} -eq 0 ]; then
            echo "No report attachments found"
            exit 0
          fi

          printf '%s\n' "${ATTACHMENTS[@]}" > attachment_paths.txt
          echo "attachments<<EOF" >> "$GITHUB_OUTPUT"
          cat attachment_paths.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Resolved report attachments:"
          cat attachment_paths.txt

      - name: Generate Dynamic Email Body
        if: always()
        run: |
          python utils/prepare_email_metadata.py \
            --report-dir "${{ env.TARGET_REPORT_DIR }}" \
            --actor "${{ github.triggering_actor || github.actor }}" \
            --run-number "${{ github.run_number }}" \
            --ref "${{ github.ref_name }}" \
            --sha "${{ github.sha }}"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: ${{ env.TARGET_REPORT_DIR }}

      - name: Send Execution Report Email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          secure: true
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            [CI/CD Notice] Test Execution Report: ${{ github.repository }} | Branch: ${{ github.ref_name }} (Run #${{ github.run_number }})
          html_body: file://email_body.html
          to: ${{ secrets.TEST_MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          attachments: ${{ steps.report_attachments.outputs.attachments }}
