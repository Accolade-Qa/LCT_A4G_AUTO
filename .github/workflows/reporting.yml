name: Test and Report Workflow

on:
  push:
    branches:
      - master
      - main
      - atcu

env:
  REPORT_DIR: ${{ github.workspace }}/reports

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      HEADLESS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install
          npx playwright install-deps

      - name: Generate test reports
        run: |
          python utils/generate_reports.py --report-dir "$REPORT_DIR"

      - name: Verify generated reports
        run: |
          echo "Checking for report files..."
          test -f "$REPORT_DIR/report.json" && echo "✓ JSON report found" || exit 1
          test -f "$REPORT_DIR/report.html" && echo "✓ HTML report found" || exit 1
          test -f "$REPORT_DIR/report.xlsx" && echo "✓ Excel report found" || exit 1

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: reports

      - name: Send report email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          secure: true
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >
            [CI] Automation Test Report | ${{ github.ref_name }} | Run #${{ github.run_number }}
          body: |
            Automation test execution is complete.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Run: #${{ github.run_number }}
            Status: ${{ job.status }}

            Attached: HTML and Excel reports.

            Regards,
            CI Automation
          content_type: text/plain
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          attachments: |
            ${{ env.REPORT_DIR }}/report.html
            ${{ env.REPORT_DIR }}/report.xlsx