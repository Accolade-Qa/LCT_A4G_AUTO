title = "Gitleaks Configuration"

[allowlist]
description = "Ignore test environment configurations, sample credentials, and documentation"
paths = [
  '''config/.*\.env''',
  '''config/.*\.yaml''',
  '''\.env$''',
  '''\.env\.example$''',
  '''commands\.md$''',
  '''utils/trigger_project_report\.py$'''
]
regexes = [
  '''YOUR_TOKEN''',
  '''6xwn8zg4''',
  '''LWj09BEg''',
  '''admin@123''',
  '''12345'''
]
